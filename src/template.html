<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <title>uBO Scriptlet &amp; Resource Regression Tests</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 20px;
      background: #101018;
      color: #e0e0e0;
    }
    #test-results {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.4em;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
      margin-bottom: 16px;
      color: #ccc;
    }
    h4 {
      color: #888;
      margin-top: 0;
    }
    h4 a {
      color: #aaf;
    }
    .test-row {
      padding: 6px 10px;
      margin: 4px 0;
      border-radius: 4px;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
      display: flex;
      gap: 12px;
      align-items: baseline;
    }
    .pass {
      background: #1b3a1b;
    }
    .fail {
      background: #3a1b1b;
    }
    @keyframes loading {
      0%    { background-position: 100% 50%; }
      60%  { background-position: 0% 50%; }
    }
    .pending {
      background: linear-gradient(
        90deg,
        #2f2a20 33.5%,
        #433b2b 40%,
        #5f5130 50%,
        #433b2b 52.5%,
        #2f2a20 55%
      );
      background-size: 300% 100%;
      animation: loading 1s ease-in-out infinite;
    }
    .status {
      font-weight: bold;
      min-width: 40px;
    }
    .pass .status {
      color: #4caf50;
    }
    .fail .status {
      color: #f44336;
    }
    .pending .status {
      color: #ffc107;
    }
    .id {
      color: #80cbc4;
      min-width: 200px;
    }
    .detail {
      color: #aaa;
      font-size: 12px;
    }
    #test-summary {
      margin-top: 20px;
      padding: 12px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 15px;
      text-align: center;
    }
    #test-summary.pass {
      background: #1b5e20;
      color: #a5d6a7;
    }
    #test-summary.fail {
      background: #b71c1c;
      color: #ef9a9a;
    }
    #test-summary.pending {
      color: #ffe082;
    }
    .secondary-pages {
      margin-top: 24px;
      padding: 12px;
      background: #16213e;
      border-radius: 4px;
    }
    .secondary-pages h2 {
      font-size: 1em;
      color: #aaa;
      margin: 0 0 8px 0;
    }
    .secondary-pages a {
      color: #80cbc4;
    }
    #setup {
      display: none;
    }
    .retry-btn {
      display: inline-block;
      padding: 4px 18px;
      margin-left: 12px;
      background: #2a2a4a;
      color: #80cbc4;
      border: 1px solid #444;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }
    .retry-btn:hover {
      background: #3a3a5a;
    }
  </style>
</head>
<body>
  <div id="setup">{{FIXTURE_HTML}}</div>
  <h1>uBO Scriptlet &amp; Resource Regression Tests</h1>
  <h4>Tests require adding <a href="/filters.txt">this filter list</a> to your adblocker's custom filters. <button class="retry-btn" onclick="window.__retryTests()">Clear storage and retry</button></h4>
{{SECONDARY_SECTION}}
  <div id="test-results">
    <div id="test-summary" class="pending">
      &nbsp;
      <noscript>This test site will not function without JavaScript enabled.</noscript>
    </div>
  </div>
  <script>
    window.__RESOURCE_TESTS__ = [
    {{TEST_DATA}}
    ];
  </script>
  <script>
{{RUNNER}}
  </script>
</body>
</html>
